project_id = "mkkqbekhvcnwcheegjpy"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
ip_version = "IPv6"
port = 54323
max_header_length = 4096

[studio]
enabled = true
port = 54324
api_url = "http://127.0.0.1:54321"
openai_api_key = "env(OPENAI_API_KEY)"

[storage]
enabled = true
port = 54328
image_transformation_enabled = true

[auth]
enabled = true
port = 54331
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
refresh_token_rotation_enabled = true
security_update_password_require_reauthentication = true
security_refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_nonce = true
secure_password_change = true

[edge_functions]
enabled = true
port = 54330

# Store API - Main public API for storefronts
[functions.store-api]
verify_jwt = false

# Oblio Invoice - Generate and send invoices via Oblio.eu
[functions.oblio-invoice]
verify_jwt = true

# Netopia Payment - Payment processing with Netopia
[functions.netopia-payment]
verify_jwt = false

# Stripe Connect — OAuth callback is an unauthenticated browser GET.
# Merchant POSTs (start_oauth, status, disconnect, set_enabled) verify JWT in-function.
[functions.stripe-connect]
verify_jwt = false

# eAWB Quoting - Get shipping quotes from eAWB/Europarcel
[functions.eawb-quoting]
verify_jwt = true

# eAWB Delivery - Create AWB and manage deliveries
[functions.eawb-delivery]
verify_jwt = true

# Test eAWB Connection - Verify eAWB API credentials
[functions.test-eawb-connection]
verify_jwt = true

# Diagnose eAWB - Debug eAWB integration issues
[functions.diagnose-eawb]
verify_jwt = true

# AI Chat - AI assistant for store management
[functions.ai-chat]
verify_jwt = true

[functions.ai-studio-generate]
verify_jwt = true

[functions.ai-studio-refine]
verify_jwt = true

[functions.ai-studio-publish]
verify_jwt = true

[functions.ai-studio-v2-critique]
verify_jwt = true

# Retired OneSignal function — always 410; JWT required so it cannot be used anonymously
[functions.push-notification]
verify_jwt = true

# FCM token registration (authenticated)
[functions.register-push-token]
verify_jwt = true

# FCM HTTP v1 send. Gateway requires a JWT (user or service_role).
# Function then allows: service_role, PUSH_INTERNAL_SECRET, or self-only user send.
[functions.send-push-notification]
verify_jwt = true

# FCM self-test — Super Admin only (is_superadmin: role + AAL2)
[functions.send-test-push]
verify_jwt = true

# SpeedVendors SaaS Billing (merchant → platform). Separate from stripe-connect.
[functions.billing-create-checkout-session]
verify_jwt = true

[functions.billing-create-portal-session]
verify_jwt = true

[functions.billing-entitlement-status]
verify_jwt = true

[functions.billing-redeem-access-code]
verify_jwt = true

# Stripe Billing webhooks — signature verified in-function (no JWT).
[functions.billing-stripe-webhook]
verify_jwt = false
